name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't cancel sibling builds when one job races to create the release;
      # rerunning the loser is a no-op against the existing release.
      fail-fast: false
      matrix:
        include:
          # darwin builds run on a macOS runner so we can compile the native
          # ScreenCaptureKit capture helper (reminal-capture) and bundle it.
          - goos: darwin
            goarch: arm64
            os: macos-14
            swift_target: arm64-apple-macos12.3
          - goos: darwin
            goarch: amd64
            os: macos-14
            swift_target: x86_64-apple-macos12.3
          # linux cross-compiles fine on ubuntu; no helper (uses screencapture
          # equivalent / X11 path).
          - goos: linux
            goarch: amd64
            os: ubuntu-latest
          - goos: linux
            goarch: arm64
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          VERSION="${VERSION#v}"
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SHORT_COMMIT="${COMMIT:0:7}"
          CGO_ENABLED=0 go build -ldflags "-s -w -X main.version=${VERSION} -X main.buildDate=${BUILD_DATE} -X main.commit=${SHORT_COMMIT} -X github.com/reminal/reminal/internal/config.DefaultCloudRelay=wss://reminal-relay.futuristic.workers.dev/ws -X github.com/reminal/reminal/internal/config.DefaultCloudWeb=https://reminal-relay.futuristic.workers.dev" -o reminal ./cmd/reminal
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build capture helper (macOS)
        if: matrix.goos == 'darwin'
        run: |
          # Native window-capture helper for the arch of this archive. Deployment
          # target 12.3 = the ScreenCaptureKit floor; on older macOS the agent
          # falls back to screencapture. Ad-hoc signed so it runs unnotarized.
          swiftc -O -target ${{ matrix.swift_target }} -o reminal-capture native/reminal-capture/main.swift
          codesign --force --sign - reminal-capture || true

      - name: Sign (macOS — self-signed, for a stable TCC identity)
        if: matrix.goos == 'darwin'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_CERT_IDENTITY: ${{ secrets.MACOS_CERT_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERT_P12}" ]; then
            echo "No signing cert (secret MACOS_CERT_P12 empty) — leaving binaries ad-hoc signed."
            echo "macOS TCC grants (e.g. Screen Recording for '+'-spawned sessions) won't persist"
            echo "across versions until a cert is configured. See docs/macos-signing.md."
            exit 0
          fi
          # Sign with a self-signed code-signing cert (no Apple Developer account
          # needed). The point isn't Gatekeeper trust — it's a STABLE identity:
          # macOS anchors a TCC permission to the code's Designated Requirement
          # (a fixed identifier + this certificate), which stays constant across
          # every release signed with the same cert. So a user grants reminal once
          # (e.g. Screen Recording, needed for background-host-spawned sessions
          # that run outside the terminal's grant) instead of on every upgrade.
          # Not notarized — fine, because Homebrew doesn't quarantine formula
          # binaries, so Gatekeeper never gates them.
          KEYCHAIN="$RUNNER_TEMP/reminal-sign.keychain-db"
          KPW="$(openssl rand -base64 24)"
          CERT="$RUNNER_TEMP/cert.p12"
          trap 'security delete-keychain "$KEYCHAIN" 2>/dev/null || true; rm -f "$CERT"' EXIT
          echo "$MACOS_CERT_P12" | base64 --decode > "$CERT"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KPW" "$KEYCHAIN" >/dev/null
          # Put our keychain first in the search list so codesign resolves the identity.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          # Stable identifiers → stable Designated Requirement across versions.
          codesign --force --timestamp=none --identifier sh.reminal --sign "$MACOS_CERT_IDENTITY" reminal
          if [ -f reminal-capture ]; then
            codesign --force --timestamp=none --identifier sh.reminal.capture --sign "$MACOS_CERT_IDENTITY" reminal-capture
          fi
          echo "--- signature ---"
          codesign -dvvv reminal 2>&1 | grep -Ei "Identifier|Authority|Signature|CDHash" || true
          codesign --verify --strict --verbose=2 reminal

      - name: Package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ARCHIVE="reminal_${VERSION}_${GOOS}_${GOARCH}.tar.gz"
          FILES="reminal"
          [ -f reminal-capture ] && FILES="$FILES reminal-capture"
          tar czf "${ARCHIVE}" $FILES
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Write release notes
        # The release commit message IS the changelog — surface it on the
        # GitHub release page instead of leaving the body empty. The CLA
        # trailer stays in git history but is noise on a release page.
        run: git log -1 --pretty=%B | sed '/^Co-Authored-By:/d' > release-notes.md

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: reminal_*.tar.gz
